# Render Blueprint for Bubrolinguo
# This file enables one-click deployment to Render
# Docs: https://render.com/docs/blueprint-spec

services:
  # API Server
  - type: web
    name: bubrolinguo-api
    runtime: docker
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: bubrolinguo-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: bubrolinguo-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://bubrolinguo.vercel.app
      - key: LOG_LEVEL
        value: info
    healthCheckPath: /
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: bubrolinguo-db
    databaseName: bubrolinguo
    user: bubrolinguo
    plan: starter
    region: oregon
    postgresMajorVersion: 15

  # Redis Cache (optional)
  - name: bubrolinguo-redis
    plan: starter
    region: oregon
    maxmemoryPolicy: allkeys-lru
